    <rect x="2" y="14" width="1" height="1"/>
    <rect x="19" y="21" width="1" height="1"/>
    <rect x="6" y="1" width="1" height="1"/>
    <rect x="4" y="21" width="1" height="1"/>
  </g>
  <g fill="#ffffff">
    <rect x="10" y="4" width="4" height="1"/>
    <rect x="9" y="5" width="6" height="1"/>
    <rect x="9" y="6" width="6" height="1"/>
    <rect x="10" y="7" width="4" height="1"/>
    <rect x="5" y="8" width="3" height="1"/>
    <rect x="9" y="8" width="6" height="1"/>
    <rect x="16" y="8" width="3" height="1"/>
    <rect x="4" y="9" width="16" height="1"/>
    <rect x="4" y="10" width="2" height="1"/>
    <rect x="7" y="10" width="10" height="1"/>
    <rect x="18" y="10" width="2" height="1"/>
    <rect x="4" y="11" width="1" height="1"/>
    <rect x="7" y="11" width="3" height="1"/>
    <rect x="11" y="11" width="2" height="1"/>
    <rect x="14" y="11" width="3" height="1"/>
    <rect x="19" y="11" width="1" height="1"/>
    <rect x="7" y="12" width="10" height="1"/>
    <rect x="7" y="13" width="1" height="1"/>
    <rect x="9" y="13" width="2" height="1"/>
    <rect x="13" y="13" width="2" height="1"/>
    <rect x="16" y="13" width="1" height="1"/>
    <rect x="7" y="14" width="10" height="1"/>
    <rect x="7" y="15" width="3" height="1"/>
    <rect x="11" y="15" width="2" height="1"/>
    <rect x="14" y="15" width="3" height="1"/>
    <rect x="6" y="16" width="12" height="1"/>
    <rect x="5" y="17" width="3" height="1"/>
    <rect x="9" y="17" width="6" height="1"/>
    <rect x="16" y="17" width="3" height="1"/>
    <rect x="5" y="18" width="2" height="1"/>
    <rect x="10" y="18" width="4" height="1"/>
    <rect x="17" y="18" width="2" height="1"/>
    <rect x="11" y="19" width="2" height="1"/>
  </g>
</svg>
