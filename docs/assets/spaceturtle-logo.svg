<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="384" height="384" shape-rendering="crispEdges" role="img" aria-label="spaceturtle logo">
  <title>spaceturtle</title>
  <!-- Drawing 1 of TurtleIcon.qml and its stroke, white on a night sky, so it reads on
       light and dark pages. The stars drift back and the flippers paddle: it travels. -->
  <defs><clipPath id="tile"><rect width="24" height="24" rx="3"/></clipPath></defs>
  <rect width="24" height="24" rx="3" fill="#0b1020"/>
  <g clip-path="url(#tile)">
    <g fill="#3d4a75">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 24" dur="9s" repeatCount="indefinite"/>
      <rect x="2" y="3" width="1" height="1"/>
      <rect x="20" y="2" width="1" height="1"/>
      <rect x="21" y="12" width="1" height="1"/>
      <rect x="6" y="17" width="1" height="1"/>
      <rect x="13" y="22" width="1" height="1"/>
      <rect x="9" y="9" width="1" height="1"/>
      <rect x="2" y="-21" width="1" height="1"/>
      <rect x="20" y="-22" width="1" height="1"/>
      <rect x="21" y="-12" width="1" height="1"/>
      <rect x="6" y="-7" width="1" height="1"/>
      <rect x="13" y="-2" width="1" height="1"/>
      <rect x="9" y="-15" width="1" height="1"/>
    </g>
    <g fill="#6f80b3">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 24" dur="4.5s" repeatCount="indefinite"/>
      <rect x="4" y="21" width="1" height="1"/>
      <rect x="19" y="19" width="1" height="1"/>
      <rect x="2" y="14" width="1" height="1"/>
      <rect x="16" y="1" width="1" height="1"/>
      <rect x="22" y="6" width="1" height="1"/>
      <rect x="4" y="-3" width="1" height="1"/>
      <rect x="19" y="-5" width="1" height="1"/>
      <rect x="2" y="-10" width="1" height="1"/>
      <rect x="16" y="-23" width="1" height="1"/>
      <rect x="22" y="-18" width="1" height="1"/>
    </g>
  </g>
  <g fill="#ffffff">
    <animate attributeName="visibility" values="visible;hidden" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="10" y="4" width="4" height="1"/>
    <rect x="9" y="5" width="6" height="1"/>
    <rect x="9" y="6" width="6" height="1"/>
    <rect x="10" y="7" width="4" height="1"/>
    <rect x="5" y="8" width="3" height="1"/>
    <rect x="9" y="8" width="6" height="1"/>
