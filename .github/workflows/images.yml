name: images
# Builds the two zone images on every change to them. A release publishes them (release.yml).
on:
  pull_request:
    paths: ['images/**', 'docs/assets/spaceturtle-banner-dark.svg', '.github/workflows/images.yml']
  push:
    branches: [main]
    paths: ['images/**', 'docs/assets/spaceturtle-banner-dark.svg', '.github/workflows/images.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agent, connector]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build arguments from images/versions.env
        id: args
        run: |
          {
            echo 'list<<ARGS'
            grep -E '^[A-Z0-9_]+=' images/versions.env
            echo ARGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          # The agent's zone image makes its banner from the one the README shows.
          build-contexts: assets=docs/assets
          build-args: ${{ steps.args.outputs.list }}
          platforms: linux/amd64
          push: false
          load: true
          tags: spaceturtle-${{ matrix.image }}-zone:ci
      - name: toon in the image
        run: docker run --rm --entrypoint toon spaceturtle-${{ matrix.image }}-zone:ci --version
      - name: The agent's zone holds no wallet, passphrase or key
        if: matrix.image == 'agent'
        run: |
          docker run --rm --entrypoint sh spaceturtle-agent-zone:ci -c '
            ! env | grep -i -E "passphrase|mnemonic|secret|agent_key" &&
            ! ls -d "$HOME/.toon" "$HOME/.config/toon" "$HOME/.local/share/toon" 2>/dev/null | grep .'
      - name: docker-agent in the agent's zone plays a banner and takes a sidebar section, and both are there
        if: matrix.image == 'agent'
        run: |
          docker run --rm --entrypoint sh spaceturtle-agent-zone:ci -c '
            docker-agent run --help | grep -q -- --banner-file &&
            docker-agent run --help | grep -q -- --sidebar-section && [ -x /usr/local/bin/spaceturtle-apps ] && [ -x /usr/local/bin/spaceturtle-limit ] &&
            [ "$(grep -c "$(printf "\\f")" /usr/local/share/spaceturtle/banner.txt)" = 239 ]'
      - name: jq is in the agent's zone, where the launcher rewrites the key file's addresses
        if: matrix.image == 'agent'
        run: docker run --rm --entrypoint jq spaceturtle-agent-zone:ci --version
      - name: gVisor is in the connector's zone, and no proxy line for the overlay client
        if: matrix.image == 'connector'
        run: |
          docker run --rm --entrypoint sh spaceturtle-connector-zone:ci -c 'runsc --version && [ ! -e /usr/local/etc/anon/anonrc-defaults ]'
