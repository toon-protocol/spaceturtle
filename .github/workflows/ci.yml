name: ci
on:
  pull_request:
  push:
    branches: [main]
  # A release runs the gate on the tagged commit before it publishes (release.yml).
  workflow_call:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of the scripts
        run: bash -n tests/run && bash -n tests/check-agent && bash -n spaceturtle && bash -n install.sh && bash -n tests/check-images && bash -n images/versions && bash -n images/connector/connector-start && bash -n release/references && bash -n release/publish-definition && bash -n release/notes && bash -n release/mark-latest
      - name: Install yq when the runner lacks it
        run: command -v yq >/dev/null || { mkdir -p "$HOME/.local/bin" && curl -fsSL -o "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 && chmod +x "$HOME/.local/bin/yq" && echo "$HOME/.local/bin" >> "${GITHUB_PATH:-/dev/null}"; }
      - name: yq is on the runner
        run: export PATH="$HOME/.local/bin:$PATH" && yq --version
      - name: Tests
        run: export PATH="$HOME/.local/bin:$PATH" && tests/run
